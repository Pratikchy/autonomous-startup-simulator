# =====================================================================
# Autonomous Virtual Startup Simulator - default (dev) configuration
# Uses an in-memory H2 database so the app runs with ZERO setup.
# For PostgreSQL, run with: --spring.profiles.active=postgres
# =====================================================================
server:
  port: 8080

spring:
  application:
    name: startup-simulator
  datasource:
    url: jdbc:h2:file:./data/startupsim;MODE=PostgreSQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

# CORS origins allowed to call the API. Defaults to the Vite dev server; set
# CORS_ALLOWED_ORIGINS (comma-separated) to configure production origins.
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  workspace:
    root-dir: ${APP_WORKSPACE_ROOT:./workspaces}
  simulation:
    # Base tick interval (ms) for the mock simulation engine at 1x speed
    tick-interval-ms: 900
  llm:
    # Legacy Phase 1 switch (retained for compatibility). See app.ai below.
    provider: mock
  ai:
    # Which LLMService implementation to use: "justdowork" (default), "gemini", "openai", or "mock".
    # Never commit a real key — set GEMINI_API_KEY / JUSTDOWORK_API_KEY / OPENAI_API_KEY in the environment.
    provider: ${AI_PROVIDER:justdowork}
    # Execution mode: REAL (default, genuine LLM reasoning required).
    mode: ${AI_MODE:REAL}
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.8-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    justdowork:
      api-key: ${JUSTDOWORK_API_KEY:}
      model: ${JUSTDOWORK_MODEL:claude-opus-4-8}
      base-url: ${JUSTDOWORK_BASE_URL:https://api.justwoker.icu/v1}
    openai:
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:gpt-4o-mini}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
    request-timeout-seconds: 45
    resilience:
      max-attempts: ${LLM_RETRY_MAX_ATTEMPTS:3}
      initial-backoff-ms: ${LLM_RETRY_INITIAL_BACKOFF_MS:250}
      backoff-multiplier: ${LLM_RETRY_BACKOFF_MULTIPLIER:2.0}
      max-backoff-ms: ${LLM_RETRY_MAX_BACKOFF_MS:2000}

logging:
  level:
    com.startupsimulator: INFO
